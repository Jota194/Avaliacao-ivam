<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cálculo com Frete e Desconto</title>
  <link rel="stylesheet" href="atividade3.css">
</head>
<body>

  <div class="container">
    <h1>Preço Final da Compra</h1>

    <label for="subtotal">Subtotal da compra (R$):</label>
    <input type="number" id="subtotal" placeholder="Ex: 300">

    <label for="frete">Valor do frete (R$):</label>
    <input type="number" id="frete" placeholder="Ex: 20">

    <button onclick="calcularTotal()">Calcular</button>

    <p id="resultado"></p>
  </div>

  <script src="atividade3.js"></script>
</body>
</html>
